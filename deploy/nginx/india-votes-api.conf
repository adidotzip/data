# Nginx configuration for India Votes Data API
# Place this file in /etc/nginx/sites-available/
# and create a symlink in /etc/nginx/sites-enabled/

upstream india_votes_api {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain name
    server_name api.yourdomain.com;
    
    # For Let's Encrypt SSL certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;
# }

# Uncomment this block after obtaining SSL certificate
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name api.yourdomain.com;
    
#     # SSL Configuration (Let's Encrypt)
#     ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
    
    # Client body size limit (for file uploads)
    client_max_body_size 20M;
    
    # Timeouts
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # Logging
    access_log /var/log/nginx/india-votes-api-access.log;
    error_log /var/log/nginx/india-votes-api-error.log;
    
    # Static files (served directly by nginx)
    location /static {
        alias /opt/india-votes-data/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Favicon
    location ~ ^/(favicon\.ico|favicon\.png|android-chrome-.*\.png|apple-touch-icon\.png|site\.webmanifest)$ {
        root /opt/india-votes-data/static;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # API and application
    location / {
        proxy_pass http://india_votes_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Don't buffer responses
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://india_votes_api;
        access_log off;
    }
}
