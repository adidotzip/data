# Docker Nginx reverse proxy for India Votes API
upstream india_votes_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-mvin.adi.rest;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    client_max_body_size 20M;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 300s;

    access_log /var/log/nginx/india-votes-api-access.log;
    error_log /var/log/nginx/india-votes-api-error.log warn;

    location / {
        proxy_pass http://india_votes_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
