services:
  postgres:
    image: postgres:15-alpine
    container_name: india-votes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: election_results
      POSTGRES_USER: election_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election_user -d election_results"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - india-votes-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: india-votes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://election_user:${DB_PASSWORD:-changeme}@postgres:5432/election_results
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
      - ./data:/app/db/data:ro
      - ./static:/app/static:ro
      - api_logs:/var/log/india-votes-api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - india-votes-net

  nginx:
    image: nginx:alpine
    container_name: india-votes-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/india-votes-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/static:ro
      - nginx_logs:/var/log/nginx
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - india-votes-net

  certbot:
    image: certbot/certbot
    container_name: india-votes-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'while :; do certbot renew; sleep 12h; done;'"
    networks:
      - india-votes-net

volumes:
  postgres_data:
  api_logs:
  nginx_logs:
  certbot_conf:
  certbot_www:

networks:
  india-votes-net:
    driver: bridge
