version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: india-votes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: election_results
      POSTGRES_USER: election_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/states.csv:/docker-entrypoint-initdb.d/states.csv:ro
      - ./data/parties.csv:/docker-entrypoint-initdb.d/parties.csv:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - india-votes-net

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: india-votes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://election_user:${DB_PASSWORD:-changeme}@postgres:5432/election_results
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
      - ./static:/app/static:ro
      - api_logs:/var/log/india-votes-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - india-votes-net

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: india-votes-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/india-votes-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/static:ro
      - nginx_logs:/var/log/nginx
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - india-votes-net
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for SSL (Optional)
  certbot:
    image: certbot/certbot
    container_name: india-votes-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  india-votes-net:
    driver: bridge
